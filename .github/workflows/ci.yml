name: CI

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Public release checks
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack
        shell: bash
        run: corepack enable

      - name: Install dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Check formatting and types
        shell: bash
        run: |
          pnpm lint
          pnpm check

      - name: Run test suite
        shell: bash
        run: pnpm test

      - name: Validate release safeguards
        shell: bash
        run: |
          pnpm validate:migrations
          pnpm secret-scan
          pnpm independence-audit
          pnpm build
